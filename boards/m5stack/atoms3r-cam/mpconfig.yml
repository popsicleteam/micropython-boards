port: esp32
base: ESP32_GENERIC_S3
variant: SPIRAM_OCT
flash: 8MB
modules:
  - aioble
  - aiohttp
  - blerepl
  - camera
  - utils
  - vision
sdkconfig:
  FREERTOS_HZ: 1000
  SCCB_HARDWARE_I2C_PORT0: True
  SCCB_CLK_FREQ: 400000
  CAMERA_CORE0: True
  CAMERA_DMA_BUFFER_SIZE_MAX: 32768
  CAMERA_PSRAM_DMA: True
